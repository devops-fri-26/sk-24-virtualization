map $http_upgrade $fray_connection { default upgrade; '' close; }
log_format fray '$request_method $uri $status ${request_time}s';
server {
    listen 443 ssl default_server;
    server_name @DOMAIN@;
    include /etc/fray/web-tls.conf;
    root /opt/fray/current/web;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    access_log syslog:server=unix:/dev/log,tag=fray_nginx fray;
    error_log syslog:server=unix:/dev/log,tag=fray_nginx warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location = /metrics { return 404; }
    include /etc/nginx/snippets/fray-grafana.conf;
    location ~ /\. { deny all; }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
# Prometheus on Noble can scrape this without a custom request header.
server {
    listen 127.0.0.1:9101;
    access_log off;
    location = /metrics {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }
    location / { return 404; }
}

# The laptop maps this Grafana management port to 127.0.0.1:18444.
server {
    listen 8443 ssl;
    server_name @DOMAIN@;
    ssl_certificate /etc/fray/origin.crt;
    ssl_certificate_key /etc/fray/origin.key;
    include /etc/nginx/snippets/fray-grafana.conf;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fray_connection;
        proxy_pass http://127.0.0.1:3000;
    }
}
