apiVersion: 1
datasources:
  - name: Fray Prometheus
    uid: fray-prometheus
    type: prometheus
    url: http://127.0.0.1:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Fray logs
    uid: fray-loki
    type: loki
    url: http://127.0.0.1:3100
    access: proxy
    editable: false
